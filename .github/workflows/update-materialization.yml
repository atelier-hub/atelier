name: Update materialization

on:
  pull_request:
    paths:
      - "**.cabal"
      - "cabal.project"
      - "flake.lock"
      - "nix/project.nix"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  materialize:
    name: Materialize ${{ matrix.system }}
    strategy:
      # One job per system, not per (system, GHC): evaluating `legacyChecks`
      # forces every GHC's materialization check, so a single job already drives
      # the whole platform's set to convergence. Splitting per GHC just made
      # each job redundantly regenerate all of them.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            system: aarch64-darwin
          - os: ubuntu-latest
            system: x86_64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://cache.iog.io
            extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=

      - uses: cachix/cachix-action@v17
        with:
          name: atelier
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Regenerate ${{ matrix.system }} materialization
        run: |
          set -o pipefail
          # Build every GHC's materialization-target together. haskell.nix emits
          # only one `generateMaterialized` command per build (the first missing
          # or stale one), so loop: run whichever it asks for, then rebuild,
          # until the whole set is consistent. Each command is generated exactly
          # once this way — including the bootstrap compiler shared by the rest.
          targets=(
            '.#legacyChecks.${{ matrix.system }}.ghc9102.materialization-target'
            '.#legacyChecks.${{ matrix.system }}.ghc98.materialization-target'
            '.#legacyChecks.${{ matrix.system }}.ghc912.materialization-target'
            '.#legacyChecks.${{ matrix.system }}.ghc914.materialization-target'
          )
          converged=
          for attempt in $(seq 1 12); do
            if nix build --no-link "${targets[@]}" 2>&1 | tee /tmp/build.log; then
              converged=1
              break
            fi
            if ! grep -q 'generateMaterialized' /tmp/build.log; then
              echo "Build failed for a reason unrelated to materialization" >&2
              cat /tmp/build.log >&2
              exit 1
            fi
            cmd="$(grep -o '/[/[:alnum:]._-]*-generateMaterialized [/_[:alnum:]/.-]*$' /tmp/build.log)"
            echo "Generating materialized files (attempt $attempt): $cmd" >&2
            eval "$cmd"
            # Nix flakes only see git-tracked files, so a newly created
            # materialization directory is invisible to the next build until it
            # is staged. Without this the loop regenerates the same dir forever.
            git add -A nix/materialized
          done
          if [ -z "$converged" ]; then
            echo "Materialization did not converge after multiple attempts" >&2
            exit 1
          fi

      - name: Produce materialization patch
        id: patch
        run: |
          # This system's materialized directories are disjoint from the other
          # system's, so each job's patch touches only its own files.
          dir='nix/materialized/${{ matrix.system }}'
          # Stage adds, modifications and deletions.
          git add -A "$dir"
          if git diff --cached --quiet -- "$dir"; then
            echo "No materialization changes for $dir" >&2
            exit 0
          fi
          git diff --name-status --cached -- "$dir"
          # A git patch (unlike an uploaded directory) carries deletions, so the
          # commit job can faithfully reproduce regenerations that remove files
          # — e.g. when a dependency moves from Hackage to a
          # source-repository-package and its cabal-files entry disappears.
          mkdir -p /tmp/patches
          git diff --cached --binary -- "$dir" \
            > "/tmp/patches/${{ matrix.system }}.patch"
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: ${{ steps.patch.outputs.upload == 'true' }}
        with:
          name: materialization-${{ matrix.system }}
          path: /tmp/patches/${{ matrix.system }}.patch

  commit:
    runs-on: ubuntu-latest
    needs:
      - materialize
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - uses: actions/download-artifact@v8
        with:
          pattern: materialization-*
          merge-multiple: true
          path: patches

      - name: Apply materialization patches
        run: |
          shopt -s nullglob
          patches=(patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No materialization patches to apply." >&2
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "Applying $p" >&2
            # --index stages adds, modifications and deletions so the PR action
            # commits them all.
            git apply --index "$p"
          done

      - uses: peter-evans/create-pull-request@v8
        if: >-
          github.event_name == 'workflow_dispatch'
          || github.event.pull_request.head.repo.full_name == github.repository
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ github.head_ref || github.ref_name }}
          branch: ci/update-materialization-${{ github.head_ref || github.ref_name }}
          commit-message: "chore: update materialization"
          title: "chore: update materialization"
          body: |
            Automated update of `nix/materialized` triggered by dependency
            changes on `${{ github.head_ref || github.ref_name }}`.
          add-paths: nix/materialized
